[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tvt4te"
version = "0.1.0.dev0"
description = "TVT: Three-View Transferability estimation for pretrained vision models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "TVT4TE Authors" }]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
extract = [
    "timm>=0.9",
    "torchvision>=0.15",
]
plot = [
    "matplotlib>=3.7",
    "pandas>=2.0",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "black>=24.0",
]

[project.scripts]
tvt = "tvt.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tvt*"]

[tool.ruff]
line-length = 99
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 99
target-version = ["py39"]
