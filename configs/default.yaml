# Default TVT benchmark configuration.

pca_dim: 64
p: 1
fusion: "geo"
train_frac: 0.8
seed: 42

datasets:
  - aircraft
  - caltech101
  - cars
  - cifar10
  - cifar100
  - dtd
  - flowers
  - food
  - pets
  - sun397
  - voc2007

models:
  - resnet34
  - resnet50
  - resnet101
  - resnet152
  - densenet121
  - densenet169
  - densenet201
  - mnasnet_a1
  - mobilenetv2
  - googlenet
  - inceptionv3
  - byol
  - deepclusterv2
  - infomin
  - mocov1
  - mocov2
  - insdis
  - pclv1
  - pclv2
  - selav2
  - swav
  - vit_timm
  - mocov3_vit
  - dino_vit
  - mae_vit
  - clip_vit

gt_accuracies:
  vit: data/gt_accuracies_vit.csv
  # cnn_sl: data/gt_accuracies_cnn_sl.csv   # TODO: add from paper supplementary
  # cnn_ssl: data/gt_accuracies_cnn_ssl.csv
